<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Беги, какашка!</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#111; font-family:system-ui, sans-serif; }
  #pd-root { width:100%; max-width:380px; margin:0 auto; user-select:none; -webkit-user-select:none; color:#eee; }
  #pd-root button { font: inherit; }
  .pd-hud { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .pd-score { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }
  .pd-best { font-size:12px; color:#999; }
  .pd-wrap { position:relative; border:1px solid #333; border-radius:12px; overflow:hidden; touch-action:none; background:#181818; }
  canvas { display:block; width:100%; height:auto; cursor:pointer; }
  .pd-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(20,20,20,.82); text-align:center; padding:16px; }
  .pd-overlay h2 { margin:0; font-size:20px; font-weight:600; }
  .pd-overlay p { margin:0; font-size:14px; color:#aaa; }
  .pd-btn { border:none; border-radius:10px; padding:10px 24px; font-size:15px; font-weight:600; cursor:pointer; background:#eee; color:#111; }
  .pd-btn:hover { opacity:.85; }
  .pd-legend { display:flex; gap:16px; justify-content:center; font-size:13px; color:#aaa; }
  .pd-legend span { display:flex; align-items:center; gap:4px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="pd-root">
  <div class="pd-hud">
    <div class="pd-score" id="pdScore">0</div>
    <div class="pd-best">рекорд: <span id="pdBest">0</span></div>
  </div>
  <div class="pd-wrap" id="pdWrap">
    <canvas id="pdCanvas" width="360" height="440"></canvas>
    <div class="pd-overlay" id="pdStart">
      <h2>Беги, какашка!</h2>
      <div class="pd-legend">
        <span><span style="font-size:18px">🌽</span> +15 очков</span>
        <span><span style="font-size:18px">🧻</span> и <span style="font-size:18px">🪠</span> — уворачивайся!</span>
      </div>
      <p>стрелки ← → или мышь / палец</p>
      <button class="pd-btn" id="pdStartBtn">Играть</button>
    </div>
    <div class="pd-overlay hidden" id="pdOver">
      <h2>Смыто! 🌀</h2>
      <p>счёт: <b id="pdFinal">0</b> · рекорд: <span id="pdFinalBest">0</span></p>
      <button class="pd-btn" id="pdRestartBtn">Ещё раз</button>
    </div>
  </div>
</div>
<script>
(function(){
  const cvs = document.getElementById('pdCanvas');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  const scoreEl = document.getElementById('pdScore');
  const bestEl = document.getElementById('pdBest');
  const startOv = document.getElementById('pdStart');
  const overOv = document.getElementById('pdOver');

  let best = 0;
  try { best = +localStorage.getItem('pd_best') || 0; } catch(e){}
  bestEl.textContent = best;

  const player = { x: W/2, y: H - 48, w: 34, h: 34, speed: 5.2 };
  const keys = {};
  let items = [], particles = [];
  let running = false, score = 0, frame = 0, lastSpawn = 0, raf = null;

  function spawnItem(){
    const r = Math.random();
    const x = 24 + Math.random() * (W - 48);
    const speedBase = 2.2 + Math.min(4.5, score / 120);
    if (r < 0.32) items.push({ x, y: -30, v: speedBase * (0.9 + Math.random()*0.4), kind: 'corn', s: 26, rot: Math.random()*6.28 });
    else items.push({ x, y: -30, v: speedBase * (0.8 + Math.random()*0.6), kind: r < 0.68 ? 'paper' : 'plunger', s: 30, rot: 0 });
  }

  function burst(x, y, emoji){
    for (let i = 0; i < 10; i++){
      particles.push({ x, y, vx: (Math.random()-0.5)*4, vy: -Math.random()*4 - 1, life: 30, emoji, s: 10 + Math.random()*8 });
    }
  }

  function drawEmoji(ch, x, y, s, rot){
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.font = s + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }

  function loop(t){
    if (!running) return;
    frame++;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
    player.x = Math.max(22, Math.min(W - 22, player.x));

    const interval = Math.max(380, 850 - score / 3);
    if (t - lastSpawn > interval){ spawnItem(); lastSpawn = t; }

    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#333';
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(0, player.y + 26); ctx.lineTo(W, player.y + 26); ctx.stroke();
    ctx.setLineDash([]);

    for (let i = items.length - 1; i >= 0; i--){
      const it = items[i];
      it.y += it.v;
      it.rot += 0.04;
      const ch = it.kind === 'corn' ? '🌽' : it.kind === 'paper' ? '🧻' : '🪠';
      drawEmoji(ch, it.x, it.y, it.s, it.kind === 'corn' ? it.rot : 0);

      const dx = it.x - player.x, dy = it.y - player.y;
      if (Math.abs(dx) < (it.s + player.w) / 2 - 6 && Math.abs(dy) < (it.s + player.h) / 2 - 6){
        if (it.kind === 'corn'){
          score += 15;
          scoreEl.textContent = score;
          burst(it.x, it.y, '✨');
          items.splice(i, 1);
          continue;
        } else {
          endGame();
          return;
        }
      }
      if (it.y > H + 40) items.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      ctx.globalAlpha = Math.max(0, p.life / 30);
      drawEmoji(p.emoji, p.x, p.y, p.s, 0);
      ctx.globalAlpha = 1;
      if (p.life <= 0) particles.splice(i, 1);
    }

    const bob = Math.sin(frame / 8) * 2.5;
    drawEmoji('💩', player.x, player.y + bob, player.h + 4, Math.sin(frame / 20) * 0.08);

    raf = requestAnimationFrame(loop);
  }

  function start(){
    score = 0; items = []; particles = []; frame = 0; lastSpawn = 0;
    scoreEl.textContent = '0';
    player.x = W / 2;
    startOv.classList.add('hidden');
    overOv.classList.add('hidden');
    running = true;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    cancelAnimationFrame(raf);
    burst(player.x, player.y, '💩');
    if (score > best){ best = score; try { localStorage.setItem('pd_best', best); } catch(e){} }
    bestEl.textContent = best;
    document.getElementById('pdFinal').textContent = score;
    document.getElementById('pdFinalBest').textContent = best;
    overOv.classList.remove('hidden');
  }

  document.getElementById('pdStartBtn').onclick = start;
  document.getElementById('pdRestartBtn').onclick = start;

  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === ' ' && !running) start();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  const wrap = document.getElementById('pdWrap');
  function moveTo(clientX){
    const r = cvs.getBoundingClientRect();
    player.x = Math.max(22, Math.min(W - 22, (clientX - r.left) / r.width * W));
  }
  wrap.addEventListener('pointermove', e => { if (running) moveTo(e.clientX); });
  wrap.addEventListener('pointerdown', e => { if (running) moveTo(e.clientX); });
})();
</script>
</body>
</html>
